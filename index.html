<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuestro Árbol Mágico</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@300;400;700&display=swap');

        :root {
            --pink-bg: #fce4ec;
            --heart-red: #ff1744;
            --env-color: #d32f2f;
            --env-light: #ef5350;
        }

        body {
            margin: 0;
            height: 100vh;
            background-color: var(--pink-bg);
            font-family: 'Montserrat', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* --- PANTALLA INICIAL --- */
        #intro { position: absolute; z-index: 100; cursor: pointer; transition: 0.5s; }
        .heart-main {
            background: white; width: 180px; height: 180px; position: relative;
            transform: rotate(-45deg); display: flex; justify-content: center; align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); animation: pulse 1.5s infinite;
        }
        .heart-main::before, .heart-main::after { content: ""; background: white; border-radius: 50%; width: 180px; height: 180px; position: absolute; }
        .heart-main::before { top: -90px; left: 0; }
        .heart-main::after { left: 90px; top: 0; }
        .text-inside { transform: rotate(45deg); position: relative; z-index: 10; text-align: center; }

        /* --- CONTENEDOR PRINCIPAL --- */
        .container { display: none; width: 95%; max-width: 1200px; grid-template-columns: 1.2fr 0.8fr; align-items: center; gap: 40px; }
        .tree-area { position: relative; height: 600px; width: 100%; display: flex; justify-content: center; align-items: flex-end; }
        .trunk { width: 30px; height: 180px; background: linear-gradient(to right, #5d4037, #795548); border-radius: 5px; position: relative; z-index: 1; }

        .heart-leaf { position: absolute; cursor: pointer; transition: 0.3s; z-index: 5; }
        .special { font-size: 38px !important; filter: drop-shadow(0 0 10px gold); z-index: 15; }
        .letter-trigger { font-size: 50px !important; animation: glow 2s infinite; z-index: 20; }

        /* --- PREGUNTA TRUCO --- */
        .question-container { margin-top: 25px; text-align: center; opacity: 0; transition: 1s; min-height: 150px; }
        .question-text { font-family: 'Dancing Script'; font-size: 2.2rem; color: #c2185b; margin-bottom: 15px; }
        .btns-group { display: flex; justify-content: center; align-items: center; gap: 25px; min-height: 60px; position: relative; }
        
        .btn-game { 
            padding: 12px 30px; border: none; border-radius: 25px; font-weight: bold; 
            cursor: pointer; font-family: 'Montserrat'; transition: 0.1s; font-size: 1rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        #btn-chi { background: #4caf50; color: white; z-index: 2; }
        #btn-no { background: #f44336; color: white; z-index: 100; transition: 0.2s ease; }

        /* --- MENSAJE FINAL CHI --- */
        #final-msg { 
            display: none; font-family: 'Dancing Script'; font-size: 2.5rem; 
            color: #ff1744; animation: zoomIn 0.8s ease forwards;
        }

        @keyframes zoomIn { from { opacity: 0; transform: scale(0.5); } to { opacity: 1; transform: scale(1); } }

        /* --- LLUVIA DE CORAZONES --- */
        .falling-heart {
            position: fixed; top: -10%; font-size: 20px; z-index: 999;
            animation: fall linear forwards;
        }
        @keyframes fall { to { transform: translateY(110vh) rotate(360deg); } }

        /* --- MODALES --- */
        .modal {
            display: none; position: fixed; z-index: 1000; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); justify-content: center; align-items: center;
        }
        .modal-content-centered { display: flex; justify-content: center; align-items: center; width: 100%; height: 100%; }

        .envelope-wrapper { 
            position: relative; width: 300px; height: 200px; background: var(--env-color); 
            border-radius: 0 0 5px 5px; cursor: pointer; transition: transform 0.8s ease;
            margin-top: 150px;
        }
        .envelope-wrapper .flap { position: absolute; top: 0; left: 0; width: 0; height: 0; border-top: 110px solid var(--env-light); border-left: 150px solid transparent; border-right: 150px solid transparent; transform-origin: top; transition: transform 0.5s ease; z-index: 10; }
        .envelope-wrapper .pocket { position: absolute; bottom: 0; left: 0; width: 0; height: 0; border-left: 150px solid var(--env-color); border-right: 150px solid var(--env-color); border-bottom: 100px solid #b71c1c; border-top: 100px solid transparent; z-index: 8; }
        
        .letter-card {
            position: absolute; bottom: 5px; left: 10px; width: 280px; height: 180px;
            background: white; padding: 25px; box-sizing: border-box; z-index: 5;
            transition: transform 0.8s ease-in-out, height 0.8s ease-in-out; border-radius: 5px; 
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        
        .envelope-wrapper.open { transform: translateY(100px); }
        .envelope-wrapper.open .flap { transform: rotateX(180deg); z-index: 1; }
        .envelope-wrapper.open .letter-card { transform: translateY(-320px); height: 420px; z-index: 15; }

        .letter-text { font-family: 'Dancing Script', cursive; font-size: 1.1rem; color: #333; text-align: center; line-height: 1.4; }
        .btn-surprise {
            margin-top: 15px; padding: 12px 25px; background: var(--heart-red); color: white;
            border: none; border-radius: 25px; font-family: 'Montserrat', sans-serif;
            font-weight: bold; cursor: pointer; transition: 0.5s;
            opacity: 0; pointer-events: none;
        }
        .envelope-wrapper.open .btn-surprise { opacity: 1; pointer-events: auto; transition-delay: 0.6s; }

        @keyframes pulse { 0%, 100% { transform: rotate(-45deg) scale(1); } 50% { transform: rotate(-45deg) scale(1.05); } }
        @keyframes glow { 0%, 100% { filter: drop-shadow(0 0 5px gold); transform: scale(1); } 50% { filter: drop-shadow(0 0 20px gold); transform: scale(1.1); } }

        .timer { font-size: 1.4rem; color: white; background: var(--heart-red); padding: 10px 30px; border-radius: 50px; display: inline-block; margin: 20px 0; }
    </style>
</head>
<body>

    <div id="intro" onclick="start()">
        <div class="heart-main"><div class="text-inside"><h1 style="color:var(--heart-red); margin:0;">PARA TI</h1><p>Toca para entrar</p><span>GO</span></div></div>
    </div>

    <div class="container" id="main">
        <div class="tree-area" id="tree"><div class="trunk"></div></div>
        <div class="content">
            <h1 id="title" style="font-family:'Dancing Script'; color:#c2185b; font-size:3.5rem; margin:0;"></h1>
            <p id="desc" style="font-size:1.2rem; color:#555;"></p>
            <div class="timer" id="clock" style="display:none;"></div>
            
            <div class="question-container" id="game-area">
                <div id="before-chi">
                    <div class="question-text">¿Siempre me dirás GO?</div>
                    <div class="btns-group">
                        <button class="btn-game" id="btn-chi" onclick="celebrate()">CHI</button>
                        <button class="btn-game" id="btn-no" onmouseover="moveNo()" onclick="moveNo()">ÑO</button>
                    </div>
                </div>
                <div id="final-msg">SABIA QUE DIRIAS QUE CHI TE AMO ❤️</div>
            </div>
        </div>
    </div>

    <div id="modal-img" class="modal" onclick="closeM('modal-img')">
        <div class="modal-box" style="text-align:center;">
            <img id="mImg" src="" style="max-width:90%; max-height:75vh; border:8px solid white; border-radius:15px;">
            <p id="mTxt" style="color:white; font-family:'Dancing Script'; font-size:2.2rem; margin-top:15px;"></p>
        </div>
    </div>

    <div id="modal-letter" class="modal" onclick="closeM('modal-letter')">
        <div class="modal-content-centered">
            <div class="envelope-wrapper" id="envelope" onclick="openEnv(event)">
                <div class="flap"></div>
                <div class="pocket"></div>
                <div class="letter-card">
                    <div class="letter-text">
                        <p><b>Mi Amor,</b></p>
                        <p>Desde aquel 27 de marzo de 2025, supe que serías especial.</p>
                        <p>Y pensar que todo empezó así... Cada momento a tu lado es lo que más valoro en mi vida.</p>
                        <p>Gracias por ser mi persona favorita.</p>
                        <button class="btn-surprise" onclick="showFinalPhoto(event)">CLIC AQUÍ</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="modal-final" class="modal" onclick="closeM('modal-final')">
        <div style="text-align:center;">
            <img src="https://cdn.discordapp.com/attachments/1340394471136956486/1472290203862568970/Captura_de_pantalla_2026-02-14_125418.png?ex=6992089a&is=6990b71a&hm=95fe8cb5c7c3d97db74d6ffc423b42aa4aaaf9b0a77e031e2961130088039da1&" style="max-width:90%; max-height:80vh; border:10px solid gold; border-radius:15px;">
            <p style="color:gold; font-family:'Dancing Script'; font-size:2.5rem;">¡Te amo! ❤️</p>
        </div>
    </div>

<script>
    const fotos = [
        { url: 'https://cdn.discordapp.com/attachments/1340394471136956486/1472285308195307731/TU_FOTO_1.jpg?ex=6992040b&is=6990b28b&hm=85de94fd6547ca05c5784301692a10d853da2a37dde8b951e4b425a376a3a782&', msg: 'Nuestro primer momento' },
        { url: 'https://media.discordapp.net/attachments/1340394471136956486/1472285305787781312/WhatsApp_Image_2026-02-14_at_1.06.29_AM_1.jpeg?ex=6992040a&is=6990b28a&hm=7254de095cf8caecb23dd467e79a0820c97284be60b9da1d206878737aeb0b35&=&format=webp&width=308&height=665', msg: 'Tu sonrisa favorita' },
        { url: 'https://cdn.discordapp.com/attachments/1340394471136956486/1472285307809566832/WhatsApp_Image_2026-02-14_at_1.06.28_AM.jpeg?ex=6992040b&is=6990b28b&hm=0a0c9e7405c47633cba636a5526966ad2eb3ec08f988dd7caf8ddb2cb452c91b&', msg: 'Lo mejor de mi vida' },
        { url: 'https://media.discordapp.net/attachments/1340394471136956486/1472285306458738870/WhatsApp_Image_2026-02-14_at_1.06.29_AM.jpeg?ex=6992040a&is=6990b28a&hm=46f14ab9c5027fb96f4d80aefe1ac21277e79a1ac09af5a095898e99c489ff98&=&format=webp&width=308&height=665', msg: 'Te amo por siempre' }
    ];

    function start() {
        document.getElementById('intro').style.opacity = '0';
        setTimeout(() => {
            document.getElementById('intro').style.display = 'none';
            document.getElementById('main').style.display = 'grid';
            createHearts();
            typeEffect();
        }, 500);
    }

    function createHearts() {
        const tree = document.getElementById('tree');
        for (let i = 0; i < 80; i++) {
            const h = document.createElement('div');
            h.className = 'heart-leaf'; h.innerHTML = '❤️';
            const angle = Math.random() * Math.PI * 2;
            const radius = Math.pow(Math.random(), 0.7) * 240;
            const x = Math.cos(angle) * radius;
            const y = Math.sin(angle) * (radius * 0.8) - 320;
            h.style.left = `calc(50% + ${x}px)`;
            h.style.top = `calc(100% + ${y}px)`;
            h.style.fontSize = `${15 + Math.random() * 15}px`;

            if (i < fotos.length) {
                h.innerHTML = '💖'; h.classList.add('special');
                h.onclick = (e) => {
                    e.stopPropagation();
                    document.getElementById('mImg').src = fotos[i].url;
                    document.getElementById('mTxt').innerText = fotos[i].msg;
                    document.getElementById('modal-img').style.display = 'flex';
                };
            }
            tree.appendChild(h);
        }
        const ch = document.createElement('div');
        ch.className = 'heart-leaf letter-trigger';
        ch.innerHTML = '💛';
        ch.style.left = '70%'; ch.style.top = 'calc(100% - 200px)';
        ch.onclick = () => { document.getElementById('modal-letter').style.display = 'flex'; };
        tree.appendChild(ch);
    }

    function moveNo() {
        const btn = document.getElementById('btn-no');
        btn.style.position = 'fixed';
        const x = Math.random() * (window.innerWidth - btn.offsetWidth);
        const y = Math.random() * (window.innerHeight - btn.offsetHeight);
        btn.style.left = x + 'px';
        btn.style.top = y + 'px';
    }

    function celebrate() {
        // Ocultar pregunta y botones
        document.getElementById('before-chi').style.display = 'none';
        // Mostrar mensaje final
        const msg = document.getElementById('final-msg');
        msg.style.display = 'block';

        // Lluvia masiva de corazones
        for (let i = 0; i < 100; i++) {
            setTimeout(() => {
                const heart = document.createElement('div');
                heart.className = 'falling-heart';
                heart.innerHTML = '❤️';
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.animationDuration = (Math.random() * 2 + 2) + 's';
                heart.style.opacity = Math.random();
                document.body.appendChild(heart);
                setTimeout(() => heart.remove(), 4000);
            }, i * 50);
        }
    }

    function showFinalPhoto(e) { e.stopPropagation(); document.getElementById('modal-final').style.display = 'flex'; }
    function openEnv(e) { e.stopPropagation(); document.getElementById('envelope').classList.toggle('open'); }
    function closeM(id) { document.getElementById(id).style.display = 'none'; if(id === 'modal-letter') document.getElementById('envelope').classList.remove('open'); }

    function typeEffect() {
        let i = 0, j = 0;
        const t1 = "Nuestra Historia", t2 = "Desde el 27 de marzo de 2025...";
        function run() {
            if (i < t1.length) { document.getElementById('title').innerHTML += t1[i++]; setTimeout(run, 100); }
            else if (j < t2.length) { document.getElementById('desc').innerHTML += t2[j++]; setTimeout(run, 50); }
            else { 
                document.getElementById('clock').style.display = 'inline-block'; 
                document.getElementById('game-area').style.opacity = '1';
                setInterval(updateTime, 1000); 
            }
        }
        run();
    }

    function updateTime() {
        const diff = new Date() - new Date(2025, 2, 27);
        const d = Math.floor(diff / 86400000);
        const h = Math.floor((diff / 3600000) % 24);
        const m = Math.floor((diff / 60000) % 60);
        const s = Math.floor((diff / 1000) % 60);
        document.getElementById('clock').innerHTML = `${d}d ${h}h ${m}m ${s}s`;
    }
</script>
</body>
</html>
