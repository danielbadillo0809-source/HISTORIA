<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Para Mi Niña Hermosa ❤️</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@400;700&display=swap');

        :root {
            --pink-bg: #ffebee;
            --heart-red: #ff1744;
            --env-color: #d32f2f;
            --env-light: #ef5350;
        }

        body {
            margin: 0; padding: 0; min-height: 100vh;
            background-color: var(--pink-bg);
            font-family: 'Montserrat', sans-serif;
            display: flex; flex-direction: column; align-items: center;
            overflow-x: hidden; touch-action: manipulation;
        }

        /* --- PANTALLA INICIAL --- */
        #intro { 
            position: fixed; inset: 0; z-index: 10000; 
            background: var(--pink-bg); display: flex; 
            justify-content: center; align-items: center; cursor: pointer;
        }
        .heart-main {
            background: white; width: 100px; height: 100px; position: relative;
            transform: rotate(-45deg); display: flex; justify-content: center; align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); animation: pulse 1.5s infinite;
        }
        .heart-main::before, .heart-main::after { content: ""; background: white; border-radius: 50%; width: 100px; height: 100px; position: absolute; }
        .heart-main::before { top: -50px; left: 0; }
        .heart-main::after { left: 50px; top: 0; }
        .text-inside { transform: rotate(45deg); position: relative; z-index: 10; color: var(--heart-red); font-weight: bold; }

        /* --- CONTENEDOR PRINCIPAL --- */
        #main { display: none; width: 100%; max-width: 500px; flex-direction: column; align-items: center; padding: 20px 0; }

        .heart-shape-container { 
            position: relative; 
            width: 380px; 
            height: 380px; 
            margin-bottom: 20px;
        }

        .leaf { position: absolute; cursor: default; user-select: none; transform: translate(-50%, -50%); }
        
        .special-leaf { font-size: 42px; filter: drop-shadow(0 0 15px gold); animation: glow 2s infinite; z-index: 500; cursor: pointer; }
        .main-envelope-trigger { font-size: 90px; z-index: 600; animation: glow 2s infinite; cursor: pointer; }

        .content-box {
            text-align: center; width: 90%; background: white; 
            padding: 25px 15px; border-radius: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            z-index: 1000;
        }
        #title { font-family: 'Dancing Script'; color: #c2185b; font-size: 2.2rem; margin: 0; }
        .timer { background: var(--heart-red); color: white; padding: 8px 20px; border-radius: 25px; font-weight: bold; font-size: 1rem; margin: 15px 0; display: inline-block; }

        .btns-group { display: flex; justify-content: center; gap: 20px; margin-top: 20px; height: 50px; position: relative; }
        .btn-game { padding: 12px 30px; border: none; border-radius: 25px; font-weight: bold; color: white; cursor: pointer; font-size: 1rem; }
        #btn-chi { background: #4caf50; }
        #btn-no { background: #f44336; }

        /* MODALES */
        .modal { display: none; position: fixed; inset: 0; z-index: 5000; background: rgba(0,0,0,0.9); justify-content: center; align-items: center; backdrop-filter: blur(5px); }
        
        .envelope-wrapper { position: relative; width: 300px; height: 200px; background: var(--env-color); border-radius: 0 0 10px 10px; cursor: pointer; }
        .envelope-wrapper .flap { position: absolute; top: 0; left: 0; width: 0; height: 0; border-top: 110px solid var(--env-light); border-left: 150px solid transparent; border-right: 150px solid transparent; transform-origin: top; transition: 0.6s; z-index: 10; }
        .envelope-wrapper .pocket { position: absolute; bottom: 0; left: 0; width: 0; height: 0; border-left: 150px solid var(--env-color); border-right: 150px solid var(--env-color); border-bottom: 100px solid #b71c1c; border-top: 100px solid transparent; z-index: 8; }
        
        .letter-card { 
            position: absolute; bottom: 5px; left: 10px; width: 280px; height: 180px; 
            background: #fffdf0; padding: 25px; box-sizing: border-box; z-index: 5; 
            transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            border-radius: 8px; text-align: center;
        }

        .envelope-wrapper.open .flap { transform: rotateX(180deg); z-index: 1; }
        .envelope-wrapper.open .letter-card { 
            transform: translateY(-50%) scale(1.15); 
            position: fixed; top: 50%; left: 50%; margin-left: -140px; 
            height: auto; min-height: 400px; z-index: 6000; 
            display: flex; flex-direction: column; justify-content: center;
        }

        /* LLUVIA DE CORAZONES */
        .falling-heart { 
            position: fixed; 
            top: -10%; 
            font-size: 24px; 
            z-index: 9999; 
            pointer-events: none;
            animation: fall linear forwards; 
        }
        @keyframes fall { 
            to { transform: translateY(110vh) rotate(360deg); } 
        }

        @keyframes pulse { 0%, 100% { transform: rotate(-45deg) scale(1); } 50% { transform: rotate(-45deg) scale(1.1); } }
        @keyframes glow { 0%, 100% { filter: drop-shadow(0 0 10px gold); } 50% { filter: drop-shadow(0 0 25px gold); } }
    </style>
</head>
<body>

    <div id="intro" onclick="start()">
        <div class="heart-main"><div class="text-inside">GO ❤️</div></div>
    </div>

    <div id="main">
        <div class="heart-shape-container" id="heart-shape"></div>
        
        <div class="content-box">
            <h1 id="title">Nuestra Historia</h1>
            <div class="timer" id="clock">0d 0h 0m 0s</div>
            
            <div id="game-area">
                <div id="before-chi">
                    <p style="font-weight: bold; color: #555; margin: 10px 0;">¿Siempre me dirás GO?</p>
                    <div class="btns-group">
                        <button class="btn-game" id="btn-chi" onclick="celebrate()">CHI</button>
                        <button class="btn-game" id="btn-no" onmouseover="moveNo()" onclick="moveNo()">ÑO</button>
                    </div>
                </div>
                <div id="final-msg" style="display:none; font-family:'Dancing Script'; font-size:1.8rem; color:var(--heart-red); margin-top:15px; font-weight: bold;">SABÍA QUE DIRÍAS QUE CHI TE AMO ❤️</div>
            </div>
        </div>
    </div>

    <div id="modal-letter" class="modal" onclick="closeM()">
        <div class="envelope-wrapper" id="envelope" onclick="openEnv(event)">
            <div class="flap"></div>
            <div class="pocket"></div>
            <div class="letter-card" id="letter" onclick="event.stopPropagation()">
                <div style="font-family:'Dancing Script'; font-size:1.4rem; color:#333; line-height: 1.5;">
                    <p style="margin-top:0;"><b>FELIZ SAN VALENTIN MI NIÑA HERMOSA</b></p>
                    <p>Aun que no podamos estar juntos hoy, quiero que sepas que siempre estas en mi corazón y mente.</p>
                    <p>Nuestro primer San Valentin... ¿Te acuerdas como pasó todo? jaja ¿GO?</p>
                    <button style="background:var(--heart-red); color:white; border:none; padding:12px 25px; border-radius:25px; cursor:pointer; font-weight:bold; margin-top:20px; font-family:'Montserrat';" onclick="showFinalPhoto()">VER FOTO ❤️</button>
                </div>
            </div>
        </div>
    </div>

    <div id="modal-final" class="modal" onclick="this.style.display='none'">
        <img src="https://cdn.discordapp.com/attachments/1340394471136956486/1472290203862568970/Captura_de_pantalla_2026-02-14_125418.png?ex=6992089a&is=6990b71a&hm=95fe8cb5c7c3d97db74d6ffc423b42aa4aaaf9b0a77e031e2961130088039da1&" style="max-width:85%; border:6px solid gold; border-radius:15px; box-shadow: 0 0 30px gold;">
    </div>

    <div id="modal-img" class="modal" onclick="this.style.display='none'">
        <div style="text-align:center;">
            <img id="mImg" src="" style="max-width:85%; border:5px solid white; border-radius:15px;">
            <p id="mTxt" style="color:white; font-family:'Dancing Script'; font-size:2rem; margin-top:15px;"></p>
        </div>
    </div>

<script>
    const fotos = [
        { url: 'https://cdn.discordapp.com/attachments/1340394471136956486/1472285308195307731/TU_FOTO_1.jpg?ex=6992040b&is=6990b28b&hm=85de94fd6547ca05c5784301692a10d853da2a37dde8b951e4b425a376a3a782&', msg: 'Tú y yo' },
        { url: 'https://media.discordapp.net/attachments/1340394471136956486/1472285305787781312/WhatsApp_Image_2026-02-14_at_1.06.29_AM_1.jpeg?ex=6992040a&is=6990b28a&hm=7254de095cf8caecb23dd467e79a0820c97284be60b9da1d206878737aeb0b35&', msg: 'Tu sonrisa' },
        { url: 'https://cdn.discordapp.com/attachments/1340394471136956486/1472285307809566832/WhatsApp_Image_2026-02-14_at_1.06.28_AM.jpeg?ex=6992040b&is=6990b28b&hm=0a0c9e7405c47633cba636a5526966ad2eb3ec08f988dd7caf8ddb2cb452c91b&', msg: 'Te amo' }
    ];

    function start() {
        document.getElementById('intro').style.display = 'none';
        document.getElementById('main').style.display = 'flex';
        renderSolidHeart();
        setInterval(updateTime, 1000);
    }

    function renderSolidHeart() {
        const container = document.getElementById('heart-shape');
        const centerX = 190;
        const centerY = 180;
        const scale = 13.5;

        for (let i = 0; i < 600; i++) {
            let x = (Math.random() - 0.5) * 35;
            let y = (Math.random() - 0.5) * 35;
            if (Math.pow(x*x + y*y - 15, 3) - x*x * Math.pow(y, 3) <= 0) {
                const leaf = document.createElement('div');
                leaf.className = 'leaf';
                leaf.innerHTML = i % 10 === 0 ? '💕' : '❤️';
                leaf.style.fontSize = (8 + Math.random() * 10) + 'px';
                leaf.style.left = (centerX + x * scale) + 'px';
                leaf.style.top = (centerY - y * scale) + 'px';
                leaf.style.opacity = 0.8 + Math.random() * 0.2;
                container.appendChild(leaf);
            }
        }

        const pos = [{t:'40px', l:'70px'}, {t:'40px', l:'310px'}, {t:'310px', l:'190px'}];
        fotos.forEach((f, i) => {
            const s = document.createElement('div');
            s.className = 'leaf special-leaf'; s.innerHTML = '💖';
            s.style.top = pos[i].t; s.style.left = pos[i].l;
            s.onclick = () => {
                document.getElementById('mImg').src = f.url;
                document.getElementById('mTxt').innerText = f.msg;
                document.getElementById('modal-img').style.display = 'flex';
            };
            container.appendChild(s);
        });

        const env = document.createElement('div');
        env.className = 'leaf main-envelope-trigger'; env.innerHTML = '💛';
        env.style.top = '160px'; env.style.left = '190px';
        env.onclick = () => document.getElementById('modal-letter').style.display = 'flex';
        container.appendChild(env);
    }

    function heartRain(amount) {
        for (let i = 0; i < amount; i++) {
            setTimeout(() => {
                const heart = document.createElement('div');
                heart.className = 'falling-heart';
                heart.innerHTML = ['❤️', '💖', '💕', '💗'][Math.floor(Math.random() * 4)];
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.animationDuration = (Math.random() * 2 + 3) + 's';
                heart.style.opacity = Math.random();
                document.body.appendChild(heart);
                setTimeout(() => heart.remove(), 4000);
            }, i * 50);
        }
    }

    function openEnv(e) { 
        e.stopPropagation(); 
        const envWrapper = document.getElementById('envelope');
        if(!envWrapper.classList.contains('open')) {
            envWrapper.classList.add('open'); 
            heartRain(45); // Lluvia al abrir
        }
    }

    function closeM() { document.getElementById('modal-letter').style.display = 'none'; document.getElementById('envelope').classList.remove('open'); }
    function showFinalPhoto() { document.getElementById('modal-final').style.display = 'flex'; }
    
    function moveNo() {
        const btn = document.getElementById('btn-no');
        const x = Math.random() * (window.innerWidth - 120);
        const y = Math.random() * (window.innerHeight - 60);
        btn.style.position = 'fixed';
        btn.style.left = x + 'px'; btn.style.top = y + 'px';
        btn.style.zIndex = "2000";
    }

    function celebrate() {
        document.getElementById('before-chi').style.display = 'none';
        document.getElementById('final-msg').style.display = 'block';
        heartRain(100); // Lluvia masiva al presionar CHI
    }

    function updateTime() {
        const diff = new Date() - new Date(2025, 2, 27);
        const d = Math.floor(diff / 86400000);
        const h = Math.floor((diff / 3600000) % 24);
        const m = Math.floor((diff / 60000) % 60);
        const s = Math.floor((diff / 1000) % 60);
        document.getElementById('clock').innerHTML = `${d}d ${h}h ${m}m ${s}s`;
    }
</script>
</body>
</html>
